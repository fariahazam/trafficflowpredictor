<!DOCTYPE html>
<html>
<head>
  <title>I-94 Traffic Prediction</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #222;
      margin: 0;
      padding: 24px;
    }
    h1 { text-align: center; margin-bottom: 4px; }
    .nav { text-align: center; margin-bottom: 20px; }
    .nav a { color: #2563eb; text-decoration: none; }

    form {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #dde1e6;
      border-radius: 10px;
      padding: 16px 20px;
    }
    form p { margin: 0 0 12px; }
    form label { display: block; font-size: 0.9rem; margin-bottom: 3px; }
    form input, form select { width: 100%; box-sizing: border-box; padding: 6px; }

    .actions { text-align: center; margin-top: 16px; }
    button {
      background: #2563eb; color: #fff; border: 0; border-radius: 8px;
      padding: 10px 28px; font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }

    .result { text-align: center; margin-top: 24px; }
    .error { text-align: center; color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Predict I-94 West Traffic</h1>
  <p class="nav"><a href="{% url 'index' %}">Back to explorer</a></p>

  <form method="get">
    {{ form.as_p }}
    <div class="actions"><button type="submit">Predict</button></div>
  </form>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if result is not None %}
    <h2 class="result">Predicted traffic: about {{ result }} vehicles/hour</h2>
  {% endif %}
</body>
</html>
